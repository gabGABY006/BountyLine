<section class="workspace-heading">
  <div>
    <p class="section-kicker"><span>///</span> CANAL SOCIAL GLOBAL</p>
    <h1>Feed de la red<span>.</span></h1>
    <p>Comparte información, sigue operaciones y conecta con la comunidad.</p>
  </div>
</section>

<div class="social-layout">
  <section class="feed-column">
    <!-- Crear publicación -->
    <form class="post-composer" (submit)="publicar($event, texto)">
      <span class="avatar cyan">{{ miIniciales }}</span>
      <div>
        <textarea #texto placeholder="¿Qué está pasando en la ciudad?"></textarea>
        <div>
          <button type="button" class="tag-button" (click)="agregarEtiqueta(texto)"># AÑADIR ETIQUETA</button>
          <button type="submit">
            PUBLICAR
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z" /><path d="M22 2 11 13" /></svg>
          </button>
        </div>
      </div>
    </form>

    <!-- Publicaciones -->
    <article class="social-post" *ngFor="let post of posts" [ngClass]="post.tone">
      <div class="post-author">
        <span class="avatar" [ngClass]="post.tone">{{ post.initials }}</span>
        <div>
          <b>{{ post.alias }}</b>
          <small>{{ post.time }}</small>
        </div>
        <button type="button" aria-label="Opciones de la publicación" (click)="abrirReporte()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="5" cy="12" r="1" /><circle cx="12" cy="12" r="1" /><circle cx="19" cy="12" r="1" /></svg>
        </button>
      </div>

      <p>{{ post.text }}</p>

      <div class="post-tags" *ngIf="post.tags.length">
        <span *ngFor="let tag of post.tags">{{ tag }}</span>
      </div>

      <div class="post-actions">
        <button type="button" class="react" [class.liked]="post.liked" (click)="reaccionar(post)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="m13 2-8 12h7l-1 8 8-12h-7Z" /></svg>
          {{ post.reactions }}
        </button>
        <button type="button" class="comments">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3 1.5-5A7 7 0 0 1 3 12V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4Z" /></svg>
          {{ post.comments }}
        </button>
        <button type="button" (click)="abrirReporte()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z" /></svg>
          REPORTAR
        </button>
      </div>

      <form class="comment-form" (submit)="comentar($event, post, comentario)">
        <input #comentario placeholder="Añadir comentario..." />
        <button type="submit">ENVIAR</button>
      </form>
    </article>
  </section>

  <!-- Columna derecha -->
  <aside class="right-rail">
    <section class="panel compact-panel">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">SUGERIDOS</p>
          <h2>Cazadores para ti</h2>
        </div>
      </div>
      <div class="compact-list">
        <button type="button" class="hunter-result" *ngFor="let hunter of hunters" [class.selected]="selectedHunter === hunter.alias" (click)="selectedHunter = hunter.alias">
          <span class="avatar" [ngClass]="hunter.tone">{{ hunter.initials }}</span>
          <span class="hunter-result-copy">
            <b>{{ hunter.alias }}</b>
            <small>{{ hunter.specialty }} · {{ hunter.zone }}</small>
            <span>
              <span class="stars">
                <svg *ngFor="let star of stars" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9Z" /></svg>
              </span>
              {{ hunter.rating }} · {{ hunter.jobs }} misiones
            </span>
          </span>
          <span class="match-score" [ngClass]="hunter.tone"><b>{{ hunter.match }}%</b><small>MATCH</small></span>
          <svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5" /></svg>
        </button>
      </div>
    </section>
  </aside>
</div>

<!-- MODAL: REPORTAR CONTENIDO -->
<div class="modal-backdrop" *ngIf="reportOpen" (click)="cerrarReporte()">
  <form class="report-modal" (click)="$event.stopPropagation()" (submit)="enviarReporte($event)">
    <span class="modal-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z" /></svg>
    </span>
    <p class="eyebrow">REPORTE DE CONTENIDO</p>
    <h2>¿Qué ocurrió?</h2>
    <select name="motivo">
      <option *ngFor="let motivo of motivos">{{ motivo }}</option>
    </select>
    <textarea name="detalle" placeholder="Añade contexto para moderación..."></textarea>
    <div class="modal-actions">
      <button type="button" (click)="cerrarReporte()">CANCELAR</button>
      <button type="submit" class="primary">ENVIAR REPORTE</button>
    </div>
  </form>
</div>

<div class="toast" *ngIf="toast">{{ toast }}</div>
