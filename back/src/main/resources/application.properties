spring.application.name=bountyline
server.port=${PORT:8080}

# MySQL en la máquina virtual (ver bd/README.md)
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3307/bountyline?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota}
spring.datasource.username=${DB_USER:bountyline_app}
spring.datasource.password=${DB_PASSWORD:BountyApp2026*}
spring.datasource.hikari.maximum-pool-size=10

# MongoDB: contenido social (publicaciones, chat y bitácora de actividad).
# Por defecto la VM BountyLine-MongoDB; para usar otro servidor (por ejemplo
# Atlas) se define la variable de entorno MONGODB_URI con la cadena de conexión.
spring.mongodb.uri=${MONGODB_URI:mongodb://bountyline_app:BountyApp2026*@127.0.0.1:27018/bountyline?authSource=admin}
spring.mongodb.database=bountyline
spring.data.mongodb.uri=${MONGODB_URI:mongodb://bountyline_app:BountyApp2026*@127.0.0.1:27018/bountyline?authSource=admin}
spring.data.mongodb.database=bountyline

# Origen del front Angular en desarrollo
bountyline.cors.origen=${CORS_ORIGEN:http://localhost:4200}

# Token JWT: clave HMAC de al menos 32 caracteres y duración en horas
bountyline.jwt.secreto=${JWT_SECRETO:BountyLine-clave-de-desarrollo-cambiar-2026!}
bountyline.jwt.horas=${JWT_HORAS:8}
